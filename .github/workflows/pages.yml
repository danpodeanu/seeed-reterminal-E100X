name: Publish Pages site

# Deploys docs/ to GitHub Pages, bundling the latest published
# firmware release assets at /firmware/latest/. Serving the bins from
# the same origin as the web flasher avoids the cross-origin fetch
# problem: GitHub's redirect chain for release-asset downloads ends at
# a signed Azure Blob URL that does not emit CORS headers, so the
# browser's fetch fails with "Failed to fetch".
#
# Trigger:
# - push to main under docs/ or this workflow
# - release.yml dispatches this workflow on main after publishing
#   assets (the `release.published` event fires with a tag ref, and
#   the github-pages environment is protected to main only, so we
#   dispatch on main instead of listening for the release event)
# - manual dispatch

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Assemble Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/firmware/latest
          cp -R docs/. site/
          # Download every firmware-*.bin from the newest release. If no
          # release exists yet, leave the directory empty; the flasher
          # will report that no binaries are available. Don't fail the
          # deploy when the release exists but has no matching assets
          # (e.g. release-firmware CI hasn't finished uploading yet) —
          # publish the docs with an empty firmware dir instead.
          if gh release view --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download \
              --repo "${{ github.repository }}" \
              --pattern 'firmware-*.bin' \
              --dir site/firmware/latest \
              || echo "No matching firmware-*.bin assets on latest release yet."
            # The three shared blobs (boot_app0.bin, bootloader.bin,
            # partitions.bin) are byte-identical across every env; the
            # web flasher's single-button manifest writes them alongside
            # the app-only -ota.bin so a "keep settings" flash lays down
            # a complete boot chain (bootloader / partitions / otadata /
            # app) at 0x0 / 0x8000 / 0xE000 / 0x10000 while leaving NVS
            # (0x9000) and SPIFFS (0x610000) untouched. Downloaded
            # separately because the firmware-*.bin pattern above skips
            # them.
            for asset in boot_app0.bin bootloader.bin partitions.bin; do
              gh release download \
                --repo "${{ github.repository }}" \
                --pattern "$asset" \
                --dir site/firmware/latest \
                || echo "No $asset asset on latest release yet."
            done
            ls -la site/firmware/latest
          else
            echo "No published release yet; skipping firmware download."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
