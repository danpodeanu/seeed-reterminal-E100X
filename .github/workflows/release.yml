name: Release firmware

# Builds every app x board combination, merges each into a single
# flashable binary, and attaches the results to the GitHub Release.
# The web flasher in docs/ reads the release assets by name.
#
# Trigger: pushing a semver tag such as `v1.2.3`. Manual runs are
# supported via `workflow_dispatch`; they build against the default
# branch and attach the assets to a draft release named "manual-<sha>".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.app }} / ${{ matrix.board }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [xkcd-viewer, weather-viewer, photo-viewer]
        board:
          - reterminal_e1001
          - reterminal_e1002
          - reterminal_e1003
          - reterminal_e1004
          - reterminal_e1005
        exclude:
          - app: xkcd-viewer
            board: reterminal_e1005
          - app: photo-viewer
            board: reterminal_e1005

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio esptool intelhex resvg_py Pillow

      - name: Create placeholder credentials
        working-directory: ${{ matrix.app }}
        run: cp include/secrets.h.example include/secrets.h

      - name: Build firmware
        working-directory: ${{ matrix.app }}
        run: pio run -e "${{ matrix.board }}"

      - name: Merge flash image
        working-directory: ${{ matrix.app }}
        run: |
          BUILD_DIR=".pio/build/${{ matrix.board }}"
          BOOT_APP0="$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n1)"
          if [ -z "$BOOT_APP0" ]; then
            echo "boot_app0.bin not found" >&2
            exit 1
          fi
          FULL="firmware-${{ matrix.app }}-${{ matrix.board }}-full.bin"
          OTA="firmware-${{ matrix.app }}-${{ matrix.board }}-ota.bin"
          # Offsets match the arduino-esp32 partition table used by the
          # Seeed reTerminal E100X boards. The merged (-full) image is
          # flashed at 0x0 via USB / web flasher and includes bootloader,
          # partitions, OTA selector, and application. The -ota image is
          # the app-only firmware.bin fed to esp_ota_write (SD OTA path).
          FLASH_SIZE=8MB
          if [ "${{ matrix.board }}" = "reterminal_e1005" ]; then
            FLASH_SIZE=32MB
          fi
          python -m esptool --chip esp32s3 merge_bin \
            --output "$FULL" \
            --flash_mode dio --flash_freq 80m --flash_size "$FLASH_SIZE" \
            0x0000   "$BUILD_DIR/bootloader.bin" \
            0x8000   "$BUILD_DIR/partitions.bin" \
            0xe000   "$BOOT_APP0" \
            0x10000  "$BUILD_DIR/firmware.bin"
          cp "$BUILD_DIR/firmware.bin" "$OTA"
          # boot_app0.bin, bootloader.bin, and partitions.bin are byte-
          # identical across the E1001-E1004 envs (same ESP32-S3 config,
          # flash size, and partition table). The web flasher's manifest
          # writes them alongside the -ota image so a "keep settings"
          # flash lays down a complete boot chain at 0x0 / 0x8000 /
          # 0xe000 / 0x10000, skipping only NVS (0x9000) and SPIFFS.
          # Publishing them once (from the photo/e1001 job below) keeps
          # the release asset count down.
          cp "$BOOT_APP0" boot_app0.bin
          cp "$BUILD_DIR/bootloader.bin" bootloader.bin
          cp "$BUILD_DIR/partitions.bin" partitions.bin
          ls -la "$FULL" "$OTA" boot_app0.bin bootloader.bin partitions.bin

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.app }}-${{ matrix.board }}
          path: |
            ${{ matrix.app }}/firmware-${{ matrix.app }}-${{ matrix.board }}-full.bin
            ${{ matrix.app }}/firmware-${{ matrix.app }}-${{ matrix.board }}-ota.bin
          if-no-files-found: error
          retention-days: 30

      - name: Upload shared boot chain (once)
        if: matrix.app == 'photo-viewer' && matrix.board == 'reterminal_e1001'
        uses: actions/upload-artifact@v7
        with:
          name: shared-boot-chain
          path: |
            ${{ matrix.app }}/boot_app0.bin
            ${{ matrix.app }}/bootloader.bin
            ${{ matrix.app }}/partitions.bin
          if-no-files-found: error
          retention-days: 30

  fonts:
    name: Prebuilt Unicode fonts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install font dependencies
        run: python -m pip install --upgrade Pillow fonttools

      - name: Generate .vlw font sizes 12-48
        run: |
          rm -rf release-fonts
          mkdir -p release-fonts
          python tools/fonts/make_vlw.py release-fonts
          cp tools/fonts/LICENSE.dejavu release-fonts/
          ls -la release-fonts/

      - name: Build sans_bold_fonts.zip
        working-directory: release-fonts
        run: |
          zip -9 ../sans_bold_fonts.zip *.vlw LICENSE.dejavu
          ls -la ../sans_bold_fonts.zip

      - name: Upload font artifact
        uses: actions/upload-artifact@v7
        with:
          name: sans_bold_fonts
          path: sans_bold_fonts.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release assets
    needs: [build, fonts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -name '*.bin' -exec cp {} release/ \;
          find artifacts -type f -name 'sans_bold_fonts.zip' -exec cp {} release/ \;
          ls -la release/

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.bin
            release/sans_bold_fonts.zip
          fail_on_unmatched_files: true

      - name: Trigger Pages redeploy on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pages.yml is deploy-branch-protected to main, so a tag ref
          # can't drive the deployment. Dispatch it explicitly on main
          # so it picks up the release we just published.
          gh workflow run pages.yml \
            --repo "${{ github.repository }}" \
            --ref main
