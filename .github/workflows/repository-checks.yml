name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repository:
    name: Check repository contents
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          for project in xkcd-viewer weather-viewer photo-viewer; do
            test -f "$project/README.md"
            test -f "$project/platformio.ini"
            test -f "$project/platformio-test.ini"
            test -f "$project/include/app_logic.h"
            test -f "$project/test/test_app_logic/test_main.cpp"
            test -f "$project/include/secrets.h.example"
          done
          test -f photo-viewer/tools/prepare_photos.py
          test -f photo-viewer/requirements.txt
          test -f xkcd-viewer/assets/e1003-xkcd-screenshot.png
          test -f weather-viewer/assets/e1001-weather-screenshot.png

      - name: Ensure private and generated files are not tracked
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(
            git ls-files |
              grep -E '(^|/)\.pio/|(^|/)firmware\.(bin|elf|map)$' ||
              true
          )"
          if [[ -n "$forbidden" ]]; then
            echo "Private or generated files must not be committed:"
            echo "$forbidden"
            exit 1
          fi

      - name: Ensure secrets.h files match their .example templates
        shell: bash
        # secrets.h is intentionally tracked now (see commit 041a416) so
        # a fresh clone builds without a manual copy step. This check is
        # the CI-side twin of .githooks/pre-commit: it refuses any
        # secrets.h that has diverged from its sibling .example -- i.e.
        # a real credential leaked in. To reshape the template legitimately,
        # update BOTH files in the same commit.
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            example="${f}.example"
            if [ ! -f "$example" ]; then
              echo "warning: no $example next to $f; skipping" >&2
              continue
            fi
            if ! diff -q "$f" "$example" >/dev/null 2>&1; then
              fail=1
              echo "error: $f differs from $example"
              echo "  Real credentials likely leaked into the tracked copy."
              echo "  Reset with: cp $example $f"
              diff -u "$example" "$f" | head -40 || true
            fi
          done < <(git ls-files | grep -E '(^|/)include/secrets\.h$' || true)
          exit $fail
