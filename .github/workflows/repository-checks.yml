name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repository:
    name: Check repository contents
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          for project in xkcd-viewer weather-viewer photo-viewer; do
            test -f "$project/README.md"
            test -f "$project/platformio.ini"
            test -f "$project/platformio-test.ini"
            test -f "$project/include/app_logic.h"
            test -f "$project/test/test_app_logic/test_main.cpp"
            test -f "$project/include/secrets.h.example"
          done
          test -f games/README.md
          test -f games/platformio.ini
          test -f games/platformio-test.ini
          test -f games/src/game_2048.h
          test -f games/src/lights_out_game.h
          test -f games/test/test_lights_out/test_main.cpp
          test -f games/assets/e1005-games-menu.png
          test -f games/assets/e1005-minesweeper.png
          test -f photo-viewer/tools/prepare_photos.py
          test -f photo-viewer/requirements.txt
          test -f xkcd-viewer/assets/e1003-xkcd-screenshot.png
          test -f weather-viewer/assets/e1001-weather-screenshot.png

      - name: Ensure private and generated files are not tracked
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(
            git ls-files |
              grep -E '(^|/)\.pio/|(^|/)firmware\.(bin|elf|map)$|(^|/)include/secrets\.h$' ||
              true
          )"
          if [[ -n "$forbidden" ]]; then
            echo "Private or generated files must not be committed:"
            echo "$forbidden"
            exit 1
          fi
