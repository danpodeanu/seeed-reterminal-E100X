name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repository:
    name: Check repository contents
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          for project in xkcd-viewer weather-viewer photo-viewer calendar-viewer; do
            test -f "$project/README.md"
            test -f "$project/platformio.ini"
            test -f "$project/platformio-test.ini"
            test -f "$project/include/app_logic.h"
            test -f "$project/test/test_app_logic/test_main.cpp"
            test -f "$project/include/secrets.h"
            test -f "$project/include/secrets.h.example"
            cmp "$project/include/secrets.h" "$project/include/secrets.h.example"
          done
          test -f sticky-arcade/README.md
          test -f sticky-arcade/platformio.ini
          test -f sticky-arcade/platformio-test.ini
          test -f sticky-arcade/src/game_2048.h
          test -f sticky-arcade/src/lights_out_game.h
          test -f sticky-arcade/test/test_lights_out/test_main.cpp
          test -f sticky-arcade/assets/e1005-sticky-arcade-menu.png
          test -f sticky-arcade/assets/e1005-minesweeper.png
          test -f sticky-fiddle/README.md
          test -f sticky-fiddle/platformio.ini
          test -f sticky-fiddle/platformio-test.ini
          test -f sticky-fiddle/src/fidget_activities.h
          test -f sticky-fiddle/test/test_activities/test_main.cpp
          test -f photo-viewer/tools/prepare_photos.py
          test -f photo-viewer/requirements.txt
          test -f xkcd-viewer/assets/e1003-xkcd-screenshot.png
          test -f weather-viewer/assets/e1001-weather-screenshot.png

      - name: Ensure private and generated files are not tracked
        shell: bash
        run: |
          set -euo pipefail
          generated="$(
            git ls-files |
              grep -E '(^|/)\.pio/|(^|/)firmware\.(bin|elf|map)$' ||
              true
          )"
          if [[ -n "$generated" ]]; then
            echo "Generated files must not be committed:"
            echo "$generated"
            exit 1
          fi
          expected_secrets=$'calendar-viewer/include/secrets.h\nphoto-viewer/include/secrets.h\nweather-viewer/include/secrets.h\nxkcd-viewer/include/secrets.h'
          tracked_secrets="$(git ls-files '*/include/secrets.h')"
          if [[ "$tracked_secrets" != "$expected_secrets" ]]; then
            echo "Only standard viewer mock secrets may be tracked:"
            echo "$tracked_secrets"
            exit 1
          fi
