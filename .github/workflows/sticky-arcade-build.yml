name: Sticky Arcade build

on:
  push:
    paths:
      - "sticky-arcade/**"
      - "common/**"
      - ".github/workflows/sticky-arcade-build.yml"
  pull_request:
    paths:
      - "sticky-arcade/**"
      - "common/**"
      - ".github/workflows/sticky-arcade-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sticky-arcade

jobs:
  unit-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Run unit tests
        run: pio test -c platformio-test.ini -e native_test

  build:
    name: reterminal_e1005
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio intelhex

      - name: Build
        run: pio run -e reterminal_e1005
