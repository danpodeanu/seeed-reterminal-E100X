[platformio]
default_envs = native_test
src_dir = src
include_dir = include

[env:native_test]
platform = native
build_flags = -std=gnu++17 -I include -I ../common/include -I test/test_config_portal
lib_deps = bblanchon/ArduinoJson @ ^7.4.2
test_framework = unity
build_src_filter = +<*>
test_build_src = yes
