; I2C bus and button scanner for the reTerminal E-series.
;
; Flash with:  pio run -d tools/i2c-scan -e reterminal_e1001 -t upload
; Then open the serial monitor:  pio device monitor -b 115200
;
; Handy when adding a new I2C device to the bus, when diagnosing a
; missing sensor, or when checking which charger IC a given board
; revision actually populates.
;
; The sketch also mirrors every scan sweep to /i2c-scan.log on the SD
; card when one is present, so you can unplug the USB and inspect the
; log later.

[platformio]
default_envs = reterminal_e1001

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#9ba53b691fb007d9c1b8fd37600cc71d6702125a
board = seeed-xiao-esp32-s3-sense
framework = arduino
upload_speed = 115200
monitor_speed = 115200
# Hold the USB-serial bridge's RTS/DTR inactive so opening or closing
# `pio device monitor` (e.g. Ctrl-C) never toggles CHIP_PU/IO0 and
# resets the ESP32 mid-refresh. esptool controls both lines directly
# during upload, so this only affects the monitor.
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
build_flags =
    -D BOARD_HAS_PSRAM
    -I ../../common/include

[env:reterminal_e1001]
build_flags = ${env.build_flags} -D RETERMINAL_MODEL=1001

[env:reterminal_e1002]
build_flags = ${env.build_flags} -D RETERMINAL_MODEL=1002

[env:reterminal_e1003]
build_flags = ${env.build_flags} -D RETERMINAL_MODEL=1003

[env:reterminal_e1004]
build_flags = ${env.build_flags} -D RETERMINAL_MODEL=1004

[env:reterminal_e1005]
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.flash_size = 32MB
board_build.partitions = ../../common/reterminal_ota.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 3145728
build_flags = ${env.build_flags} -D RETERMINAL_MODEL=1005
