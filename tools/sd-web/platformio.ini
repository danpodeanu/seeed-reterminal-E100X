; SD-card Wi-Fi portal tool for the reTerminal E-series.
;
; Boots into an open Wi-Fi access point and serves a small HTTP portal
; that lets a phone or laptop browse, download, upload, mkdir, and
; delete on the inserted SD card. Two on-panel QR codes: one joins the
; AP, the other opens the portal URL.
;
; Flash with:  pio run -d tools/sd-web -e reterminal_e1001 -t upload
;
; Works on E1001 / E1002 / E1003 / E1004 / E1005. Renders the boot screen once
; and then services HTTP requests until reset. No deep sleep.

[platformio]
default_envs = reterminal_e1001

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#9ba53b691fb007d9c1b8fd37600cc71d6702125a
board = seeed-xiao-esp32-s3-sense
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
lib_ldf_mode = deep+
build_flags =
    -D BOARD_HAS_PSRAM
    -I ../../common/include
    -I ../../common-sd-web/include
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WebServer/src
lib_deps =
    symlink://../../common
    symlink://../../common-sd-web
    https://github.com/Seeed-Studio/Seeed_GFX.git#a2de1abca0597c202193f22d01e9fa35d1ff613b
    adafruit/Adafruit SHT4x Library @ ^1.0.5
    ricmoo/QRCode @ ^0.0.1

[env:reterminal_e1001]
build_flags = ${env.build_flags} -D RETERMINAL_MODEL=1001

[env:reterminal_e1002]
build_flags = ${env.build_flags} -D RETERMINAL_MODEL=1002

[env:reterminal_e1003]
build_flags = ${env.build_flags} -D RETERMINAL_MODEL=1003

[env:reterminal_e1004]
build_flags = ${env.build_flags} -D RETERMINAL_MODEL=1004

[env:reterminal_e1005]
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.flash_size = 32MB
board_build.partitions = ../../common/reterminal_ota.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 3145728
build_flags = ${env.build_flags} -D RETERMINAL_MODEL=1005
